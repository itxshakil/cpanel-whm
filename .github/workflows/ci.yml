name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    # release.yml runs the same checks on a tag before validating it.
    workflow_call:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# No job writes anything, so a change to the repository's default token scope
# never hands write access to these jobs or the actions they run.
permissions:
    contents: read

# No job talks to a real WHM server: every test fakes the network.
jobs:
    lint:
        name: Lint (Pint)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer
                  coverage: none
            - uses: ramsey/composer-install@v4
            - run: vendor/bin/pint --test
            - name: Lint GitHub Actions workflows
              uses: raven-actions/actionlint@v2

    analyse:
        name: Static Analysis (PHPStan, level max | PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # PHPStan reads the running PHP's function signatures, so some
                # errors only show on the newest version (chr() on 8.5, for one).
                php: ["8.4", "8.5"]
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer
                  coverage: none
            - uses: ramsey/composer-install@v4
            - run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

    packagist:
        name: Composer / Packagist Validation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer
                  coverage: none
            - run: composer validate --strict
            - run: composer dump-autoload --dry-run --optimize

    test:
        name: Tests (${{ matrix.os == 'windows-latest' && 'Windows | ' || '' }}PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }} | ${{ matrix.deps }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: ["8.3", "8.4", "8.5"]
                # The floors match composer.json. Composer won't install releases
                # with security advisories, so lower ones could never be tested.
                laravel: ["^12.69", "^13.30"]
                deps: [lowest, highest]
                # One Windows job: path handling in whm:record and Whm::fixture()
                # has broken there before without Linux noticing.
                include:
                    - os: windows-latest
                      php: "8.5"
                      laravel: "13.*"
                      deps: highest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, mbstring, intl, openssl, fileinfo, curl
                  tools: composer
                  coverage: none
            - name: Pin Laravel version
              run: composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
            - uses: ramsey/composer-install@v4
              with:
                  dependency-versions: ${{ matrix.deps }}
            - run: vendor/bin/phpunit

    # One stable check to require in branch protection, instead of every
    # matrix job by name (those names change whenever the matrix does).
    ci-passed:
        name: CI passed
        if: always()
        needs: [lint, analyse, packagist, test]
        runs-on: ubuntu-latest
        steps:
            - name: Fail if any required job failed or was cancelled
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
            - run: echo "All CI jobs passed."
