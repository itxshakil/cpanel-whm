name: Release

# Runs the full CI on the tagged commit, then validates that it installs
# cleanly as a Composer package. A tag pushed from a commit that never went
# through CI (a local tag, a hotfix) is tested here before anyone installs it.
# Release notes are drafted continuously by release-drafter.yml; publish the
# draft (or `gh release create`) after this workflow passes.
on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    ci:
        name: CI
        uses: ./.github/workflows/ci.yml

    release:
        name: Release Validation
        needs: ci
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: 8.4
                  tools: composer
                  coverage: none

            # Installs the tag's `git archive`, which is what Packagist ships:
            # .gitattributes trims it, so the full checkout could pass while
            # the published package is missing files.
            - name: Check the archive Packagist ships
              run: bin/check-archive "$GITHUB_SHA"
