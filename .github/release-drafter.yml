name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# The version and the section come from "type: …" labels, which the autolabeler
# sets from the PR title's Conventional Commit prefix. The area labels from
# labeler.yml (client, modules, tests, documentation, …) say where a change is,
# not what it is: a bug fix touches src/ and tests/ too.
sync-labels: true
autolabeler:
    - labels: [breaking-change]
      title: ['/^[a-z]+(\(.+\))?!:/']
    - labels: ["type: feature"]
      stop-on-match: true
      title: ['/^feat(\(.+\))?!?:/']
    - labels: ["type: fix"]
      stop-on-match: true
      title: ['/^fix(\(.+\))?!?:/']
    - labels: ["type: docs"]
      stop-on-match: true
      title: ['/^docs(\(.+\))?!?:/']
    - labels: ["type: test"]
      stop-on-match: true
      title: ['/^test(\(.+\))?!?:/']
    - labels: ["type: ci"]
      stop-on-match: true
      title: ['/^(ci|build)(\(.+\))?!?:/']
    - labels: ["type: chore"]
      stop-on-match: true
      title: ['/^(chore|refactor|perf|style|deps)(\(.+\))?!?:/']

version-resolver:
    major:
        labels:
            - breaking-change
    minor:
        labels:
            - "type: feature"
    default: patch

categories:
    - title: "⚠️ Breaking Changes"
      labels: [breaking-change]
    - title: "🚀 New Features"
      labels: ["type: feature"]
    - title: "🐛 Bug Fixes"
      labels: ["type: fix"]
    - title: "📚 Documentation"
      labels: ["type: docs"]
    - title: "🧪 Tests"
      labels: ["type: test"]
    - title: "🔧 CI / Tooling"
      labels: ["type: ci"]
    - title: "🧹 Maintenance"
      labels: ["type: chore"]

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

template: |
    ## Changes

    $CHANGES

# Release Drafter's key is exclude-labels; it ignores an "exclude:" block.
exclude-labels:
    - skip-changelog
