version: 2
updates:
  # One grouped PR a month for every GitHub Action, instead of one PR per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    # "ci:" titles get the "type: ci" label from the release-drafter autolabeler.
    commit-message:
      prefix: ci
